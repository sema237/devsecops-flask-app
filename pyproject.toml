[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.builds.meta"

[project]
name = "devsecops-flask-app"
version = "0.1.0"
description = "DevSecOps Flask application template"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]
ignore = ["S101"]   # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
