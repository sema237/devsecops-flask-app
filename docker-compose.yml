version: '3.8'


services:
  app:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # Hot reload for development

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Optional: Cloud SQL Auth Proxy for staging DB access
  # cloud-sql-proxy:
  #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
  #   command:
  #     - '--port=5433'
  #     - 'PROJECT:REGION:INSTANCE'
  #   ports:
  #     - '5433:5433'


volumes:
  pgdata:
