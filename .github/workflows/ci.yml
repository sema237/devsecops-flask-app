name: CI Pipeline


on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]


permissions:
  contents: read
  security-events: write   # For SARIF uploads


env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: devsecops-flask-app


jobs:
  # ──────────────────────────────────────────
  # JOB 1: Code Quality + Security Linting
  # ──────────────────────────────────────────
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff Lint
        run: ruff check app/ tests/ --output-format=github

      - name: Ruff Format Check
        run: ruff format --check app/ tests/

      - name: Bandit Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json -ll || true
          bandit -r app/ -ll  # Human-readable output for logs

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ──────────────────────────────────────────
  # JOB 2: Dependency Vulnerability Scan
  # ──────────────────────────────────────────
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: pip-audit (Vulnerability Scan)
        run: pip-audit --format=json --output=pip-audit.json || true

      - name: pip-audit (Human Readable)
        run: pip-audit

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json

  # ──────────────────────────────────────────
  # JOB 3: Secret Detection
  # ──────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for secret scanning

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────
  # JOB 4: Tests + Coverage
  # ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint-and-security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────
  # JOB 5: SAST with Semgrep
  # ──────────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep SAST Scan
        run: |
          semgrep scan \
            --config=auto \
            --config=p/python \
            --config=p/flask \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif \
            --error  # Fail on findings

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ──────────────────────────────────────────
  # JOB 6: Build + Scan Docker Image
  # ──────────────────────────────────────────
  build-and-scan:
    runs-on: ubuntu-latest
    needs: [test, sast, dependency-scan, secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'   # Fail on critical/high

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
