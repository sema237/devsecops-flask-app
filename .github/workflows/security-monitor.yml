name: Security Monitor

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  cve-scan:
    name: CVE Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit

      - name: Run pip-audit
        id: audit
        run: |
          if pip-audit -r requirements.txt --format json -o audit-results.json; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Open GitHub issue on findings
        if: steps.audit.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            const vulns = results.dependencies?.filter(d => d.vulns?.length) ?? [];
            if (vulns.length === 0) return;

            const body = vulns.map(d =>
              `### ${d.name}@${d.version}\n` +
              d.vulns.map(v => `- **${v.id}**: ${v.description}\n  Fix: ${v.fix_versions?.join(', ') || 'no fix available'}`).join('\n')
            ).join('\n\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Vulnerable dependencies detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Dependency Vulnerabilities Found\n\n${body}\n\n_Generated by scheduled security monitor._`,
              labels: ['security', 'dependencies'],
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cve-scan-results
          path: audit-results.json
