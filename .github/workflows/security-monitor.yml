name: Scheduled Security Scan


on:
  schedule:
   # - cron: '0 6 * * *'   # Daily at 6 AM UTC
  # workflow_dispatch:        # Manual trigger


permissions:
  contents: read
  id-token: write           # For Workload Identity Federation
  issues: write             # For auto-opening GitHub issues on findings
  security-events: write    # For SARIF uploads


env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devsecops-repo/flask-app:latest


jobs:
  # ──────────────────────────────────────────
  # JOB 1: Dependency CVE Scan
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tools
        run: pip install pip-audit

      - name: Run pip-audit
        id: audit
        run: |
          if pip-audit -r requirements.txt --format json -o audit-results.json; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Open GitHub issue on findings
        if: steps.audit.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            const vulns = results.dependencies?.filter(d => d.vulns?.length) ?? [];
            if (vulns.length === 0) return;

            const body = vulns.map(d =>
              `### ${d.name}@${d.version}\n` +
              d.vulns.map(v =>
                `- **${v.id}**: ${v.description}\n  Fix: ${v.fix_versions?.join(', ') || 'no fix available'}`
              ).join('\n')
            ).join('\n\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Vulnerable dependencies detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## Dependency Vulnerabilities Found\n\n${body}\n\n_Generated by scheduled security monitor._`,
              labels: ['security', 'dependencies'],
            });

      - name: Upload dependency audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-results
          path: audit-results.json

      - name: Notify Slack on dependency findings
        if: failure() || steps.audit.outputs.found == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: *Dependency CVEs detected* in `${{ github.repository }}`.\nReview: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  # ──────────────────────────────────────────
  # JOB 2: Production Container Image Scan
  # ──────────────────────────────────────────
  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Pull production image
        run: docker pull ${{ env.IMAGE }}

      - name: Trivy — scan for latest CVEs
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-nightly

      - name: Upload Trivy results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-results
          path: trivy-results.sarif

      - name: Notify Slack on image vulnerabilities
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *SECURITY ALERT*: New CRITICAL/HIGH vulnerabilities found in the production image `flask-app:latest`.\nReview: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  # ──────────────────────────────────────────
  # JOB 3: Secret Detection (Full History)
  # ──────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history — catch secrets added then removed

      - name: Gitleaks secret scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack on secret detection
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":key: *SECRET DETECTED* in `${{ github.repository }}` commit history.\nImmediate rotation required.\nReview: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
